<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#176534">
<title>शिक्षक साथी बिहार v4.6 सुधारित प्रारूप</title>
<style>
:root{--green:#176534;--green2:#e8f5e9;--blue:#176ba0;--ink:#193044;--muted:#637381;--line:#dbe4e9;--bg:#f2f6f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:900px;margin:auto;padding:14px}
.hero{border-radius:22px;padding:22px 18px;color:white;background:linear-gradient(120deg,#155d2b,#16824b);position:relative;overflow:hidden;margin:8px 0 16px}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:#ffffff12;right:-35px;top:-35px}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{font-size:34px;background:#ffffff20;border:1px solid #ffffff55;border-radius:16px;padding:6px}
.brand h1{font-size:clamp(23px,5vw,34px);line-height:1.2;margin:0}
.ver{font-size:14px;background:#ffffff22;border-radius:8px;padding:3px 8px;white-space:nowrap}
.sub{font-size:17px;margin:8px 0 0;color:#effff2}
.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #19304408}
.card h2{font-size:23px;margin:0 0 14px}.card h3{font-size:19px;margin:0 0 10px}
.muted{color:var(--muted)}label{display:block;font-weight:700;margin:13px 0 6px}
input,select,textarea{width:100%;font:inherit;border:1px solid #cbd7de;border-radius:13px;padding:13px 14px;background:white;color:var(--ink);min-height:48px}
textarea{min-height:100px;resize:vertical}
button{font:inherit;font-weight:700;border:0;border-radius:13px;padding:13px 15px;min-height:46px;cursor:pointer;background:#eaf1f6;color:#21425b}
button:disabled{opacity:.65;cursor:wait}
button.primary{background:var(--blue);color:white}button.green{background:var(--green);color:white}button.danger{background:#fff0f0;color:#a12828}
.full{width:100%;margin-top:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.notice{background:#fff7df;border:1px solid #eedb98;color:#69551c;padding:13px;border-radius:14px;margin-top:15px;font-size:14px}
.hidden{display:none!important}.admin-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.admin-tabs button{border:1px solid var(--line);background:#f7fafb}.admin-tabs button.active{background:var(--green);color:#fff}.filter-grid{display:grid;grid-template-columns:1fr;gap:10px}.filter-card{background:#f7fbf8;border:1px solid #d6e8d9;border-radius:14px;padding:14px}.section-panel{padding-top:8px}.small-note{font-size:13px;color:var(--muted)}@media(min-width:600px){.filter-grid{grid-template-columns:1fr 1fr}.admin-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}.dashhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.profile{display:flex;align-items:center;gap:12px}.avatar{width:54px;height:54px;border-radius:50%;background:var(--green2);display:grid;place-items:center;font-size:26px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;background:#e4e9e8;padding:10px;border-radius:16px;margin:14px 0}
.menu button{background:white;padding:12px 8px;min-height:58px;font-size:15px}.menu button.active{background:var(--green);color:white}
.content{min-height:180px}.bottom-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.bottom-nav button{width:100%}
.status{padding:9px 12px;border-radius:10px;background:#eef6ff;margin:8px 0;overflow-wrap:anywhere}
.pill{display:inline-block;padding:3px 8px;border-radius:8px;background:#e8f5e9;color:#176534;font-size:13px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;overflow-wrap:anywhere}
footer{text-align:center;color:#788590;padding:20px 8px;font-size:13px}
@media(min-width:680px){.menu{grid-template-columns:repeat(3,minmax(0,1fr))}.wrap{padding:22px}.card{padding:24px}}
@media(max-width:360px){.wrap{padding:9px}.card{padding:15px}.hero{padding:18px 14px}.menu{gap:6px;padding:7px}.menu button{font-size:13px;padding:9px 5px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div class="brand"><div class="logo">📘</div><div><div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap"><h1>शिक्षक साथी बिहार</h1><span class="ver">v4.6 · सुधारित प्रारूप</span></div><div class="sub">डिजिटल शिक्षण पोर्टल</div></div></div></header>

<section id="setup" class="card hidden">
<h2>🔐 पहली बार मुख्य एडमिन बनाएँ</h2>
<form id="setupForm">
<label for="adminName">मुख्य एडमिन का नाम</label><input id="adminName" required placeholder="जैसे: सुशील कुमार">
<label for="adminId">मुख्य एडमिन की मोबाइल नंबर / यूज़र आईडी</label><input id="adminId" required inputmode="text" autocomplete="username">
<label for="adminPhone">मोबाइल नंबर</label><input id="adminPhone" required inputmode="tel" minlength="10" maxlength="13">
<label for="adminPass">पासवर्ड (कम से कम 8 अक्षर)</label><input id="adminPass" type="password" required minlength="8" autocomplete="new-password">
<label for="adminPass2">पासवर्ड दोबारा लिखें</label><input id="adminPass2" type="password" required minlength="8" autocomplete="new-password">
<button class="primary full" type="submit">ऑनलाइन एडमिन खाता बनाएँ</button>
</form><div id="setupMsg" class="status hidden" role="status" aria-live="polite"></div>
</section>

<section id="login" class="card hidden">
<h2>🔐 सुरक्षित ऑनलाइन प्रवेश</h2>
<form id="loginForm">
<label for="loginId">यूज़र आईडी / मोबाइल नंबर</label><input id="loginId" required autocomplete="username" placeholder="अपनी आईडी लिखें">
<label for="loginPass">पासवर्ड</label><input id="loginPass" type="password" required autocomplete="current-password" placeholder="पासवर्ड लिखें">
<button class="primary full" type="submit">लॉगिन करें</button>
</form>
<div class="row"><button id="goCreateTeacher" type="button">शिक्षक स्वयं पंजीकरण</button></div>
<div id="loginMsg" class="status hidden" role="status" aria-live="polite"></div>
<section id="signupBox" class="item hidden">
<h3>शिक्षक स्वयं पंजीकरण (ऑनलाइन)</h3>
<form id="signupForm">
<label for="suName">शिक्षक का नाम</label><input id="suName" required>
<label for="suPhone">मोबाइल नंबर (यूज़र आईडी)</label><input id="suPhone" inputmode="tel" minlength="10" maxlength="13" required>
<label for="suSchool">विद्यालय का नाम</label><input id="suSchool" required>
<label for="suBlock">प्रखंड</label><input id="suBlock" required>
<label for="suDistrict">जिला</label><input id="suDistrict" required>
<label for="suPass">अपना पासवर्ड बनाएँ</label><input id="suPass" type="password" minlength="8" autocomplete="new-password" required>
<label for="suPass2">पासवर्ड दोबारा लिखें</label><input id="suPass2" type="password" minlength="8" autocomplete="new-password" required>
<button class="primary full" type="submit">पंजीकरण करें</button>
</form><button id="closeSignup" type="button">वापस लॉगिन पर जाएँ</button>
</section>
</section>

<section id="app" class="hidden">
<div class="card dashhead"><div class="profile"><div class="avatar">👨‍🏫</div><div><b id="welcome">स्वागत है</b><div id="userMeta" class="muted"></div></div></div><button id="logout" type="button">लॉग आउट</button></div>
<nav class="menu" id="menu"><button class="active" data-page="lesson" type="button">📖 पाठ-टीका</button><button data-page="admin" id="adminMenu" type="button">👑 एडमिन</button></nav>
<section class="card content" id="pageContent"></section>
</section>
<footer>शिक्षक साथी बिहार · डिजिटल शिक्षण पोर्टल</footer>
</main>

<script>
(()=>{'use strict';
window.STORE='shikshak_saathi_v44';
window.current=null;
window.db={users:[]};
window.show=id=>['setup','login','app'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
window.msg=(id,s)=>{const e=document.getElementById(id);if(e){e.textContent=s;e.classList.remove('hidden')}};
window.isAdmin=()=>['admin','subadmin'].includes(window.current?.role);
window.esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('goCreateTeacher').addEventListener('click',()=>{document.getElementById('signupBox').classList.remove('hidden');document.getElementById('loginForm').classList.add('hidden');document.getElementById('loginMsg').classList.add('hidden')});
document.getElementById('closeSignup').addEventListener('click',()=>{document.getElementById('signupBox').classList.add('hidden');document.getElementById('loginForm').classList.remove('hidden')});
document.getElementById('logout').addEventListener('click',()=>{window.current=null;window.show('login');document.getElementById('loginPass').value='';});
window.renderApp=()=>{
 window.show('app');
 document.getElementById('welcome').textContent='स्वागत है, '+(window.current.name||'शिक्षक');
 document.getElementById('userMeta').textContent=(window.current.school||'')+(window.current.role==='admin'?' (मुख्य एडमिन)':window.current.role==='subadmin'?' (सह-एडमिन)':'');
 document.getElementById('adminMenu').classList.toggle('hidden',!window.isAdmin());
 window.page('lesson');
 if(window.isAdmin())window.fetchUsersFromFirebase();
};
document.getElementById('menu').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b&&!b.classList.contains('hidden'))window.page(b.dataset.page)});
window.page=which=>{
 if(which==='admin'&&!window.isAdmin())which='lesson';
 document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('active',b.dataset.page===which));
 const c=document.getElementById('pageContent');
 if(which==='lesson')c.innerHTML=`
 <h2>📖 पाठ्यक्रम / पाठ-टीका</h2>
 <p class="muted">पहले अपनी जरूरत चुनें। सेव करने के बाद पेज पर उसी चयन की सामग्री दिखाई जाएगी।</p>
 <div class="filter-card"><div class="filter-grid">
 <div><label for="lessonClass">कक्षा</label><select id="lessonClass"><option value="">कक्षा चुनें</option><option>कक्षा 1</option><option>कक्षा 2</option><option>कक्षा 3</option><option>कक्षा 4</option><option>कक्षा 5</option></select></div>
 <div><label for="lessonSubject">विषय</label><select id="lessonSubject"><option value="">विषय चुनें</option><option>हिंदी</option><option>अंग्रेज़ी</option><option>गणित</option><option>पर्यावरण अध्ययन</option><option>उर्दू</option></select></div>
 <div><label for="lessonPeriod">घंटी / पीरियड</label><select id="lessonPeriod"><option value="">घंटी चुनें</option>${Array.from({length:8},(_,i)=>`<option value="${i+1}">घंटी ${i+1}</option>`).join('')}</select></div>
 <div><label for="lessonDay">दिन</label><select id="lessonDay"><option value="">दिन चुनें</option><option>सोमवार</option><option>मंगलवार</option><option>बुधवार</option><option>गुरुवार</option><option>शुक्रवार</option><option>शनिवार</option></select></div>
 <div><label for="lessonMonth">महीना</label><select id="lessonMonth"><option value="">महीना चुनें</option>${['अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर','जनवरी','फ़रवरी','मार्च'].map(m=>`<option>${m}</option>`).join('')}</select></div>
 </div><button class="green full" id="saveLessonFilter" type="button">चयन सेव करें</button><p id="filterStatus" class="small-note" aria-live="polite"></p></div>
 <div id="selectedLessonWall" class="item"><h3>आपका चयन</h3><p class="muted">कक्षा, विषय, घंटी, दिन और महीना चुनकर सेव करें।</p></div>
 <div class="notice">ध्यान दें: इस v4.6 प्रारूप में चयन और पेज का ढाँचा जोड़ा गया है। वास्तविक पाठ-टीका/प्रश्नों के रिकॉर्ड अभी इस फ़ाइल में उपलब्ध नहीं हैं; डेटाबेस जोड़ने पर केवल चुने हुए रिकॉर्ड दिखाने होंगे।</div>`;
 else if(which==='admin')c.innerHTML=`
 <h2>👑 एडमिन पैनल</h2><p class="muted">हर काम अलग टैब में रखा गया है, ताकि एक ही पेज पर बहुत सारी सेटिंग न खुलें।</p>
 <div class="admin-tabs" id="adminTabs">
 <button type="button" class="active" data-tab="accounts">👥 खाते</button>
 <button type="button" data-tab="firebase">🔥 Firebase</button>
 <button type="button" data-tab="telegram">✈️ Telegram</button>
 <button type="button" data-tab="permissions">🛡️ अधिकार</button>
 <button type="button" data-tab="backup">💾 बैकअप</button>
 <button type="button" data-tab="reports">📊 रिपोर्ट</button>
 </div>
 <div id="adminTabContent" class="section-panel"></div>`;
 if(which==='lesson')window.wireLessonFilters();
 if(which==='admin')window.wireAdminTabs();
};

window.wireLessonFilters=()=>{
 const ids=['lessonClass','lessonSubject','lessonPeriod','lessonDay','lessonMonth'];
 const key='ssb_saved_lesson_filter_v46';
 try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved)ids.forEach(id=>{const el=document.getElementById(id);if(el)el.value=saved[id]||''})}catch(e){}
 const draw=()=>{
  const vals=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)?.value||'']));
  const box=document.getElementById('selectedLessonWall');
  const names=['कक्षा','विषय','घंटी','दिन','महीना'];
  const values=ids.map(id=>vals[id]);
  if(values.some(Boolean))box.innerHTML='<h3>आपका चयन</h3>'+names.map((n,i)=>'<div><b>'+n+':</b> '+window.esc(values[i]||'नहीं चुना')+'</div>').join('')+'<p class="small-note">यह चयन इस डिवाइस पर सेव है। साझा ऑनलाइन रिकॉर्ड अभी जोड़ा जाना बाकी है।';
 };
 document.getElementById('saveLessonFilter')?.addEventListener('click',()=>{
  const vals=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)?.value||'']));
  if(ids.some(id=>!vals[id])){document.getElementById('filterStatus').textContent='कृपया कक्षा, विषय, घंटी, दिन और महीना—सभी चुनें।';return}
  try{localStorage.setItem(key,JSON.stringify(vals));document.getElementById('filterStatus').textContent='चयन इस डिवाइस पर सेव हो गया।';draw()}
  catch(e){document.getElementById('filterStatus').textContent='सेव नहीं हो पाया। ब्राउज़र स्टोरेज जाँचें।'}
 });
};
window.wireAdminTabs=()=>{
 const root=document.getElementById('adminTabContent');
 const render=tab=>{
  document.querySelectorAll('#adminTabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  if(tab==='accounts'){
   root.innerHTML='<h3>शिक्षक / सह-एडमिन खाते</h3><form id="teacherForm"><label for="tName">नाम</label><input id="tName" required><label for="tId">मोबाइल नंबर (यूज़र आईडी)</label><input id="tId" required inputmode="tel"><label for="tSchool">विद्यालय</label><input id="tSchool"><label for="tBlock">प्रखंड</label><input id="tBlock"><label for="tDistrict">जिला</label><input id="tDistrict"><label for="tPass">पासवर्ड (नया खाता बनाते समय आवश्यक)</label><input id="tPass" type="password" minlength="8" autocomplete="new-password"><label for="tRole">भूमिका</label><select id="tRole"><option value="teacher">सामान्य शिक्षक</option><option value="subadmin">सह-एडमिन</option></select><button class="primary full" type="submit" id="saveUserButton">खाता बनाएँ</button></form><h3>खाता सूची</h3><div id="teacherList"><p class="muted">लोड हो रहा है...</p></div>';
   if(window.wireAdmin)window.wireAdmin();
  }else if(tab==='firebase'){
   root.innerHTML='<h3>🔥 Firebase सेटिंग</h3><p>यह टैब Firebase कनेक्शन, डेटाबेस और सिंक स्थिति के लिए है।</p><div class="notice">Firebase की निजी सर्वर कुंजी या सेवा-खाता कुंजी HTML में न रखें। सुरक्षा के लिए Firestore Rules अलग से सुरक्षित करनी होंगी।</div><div class="status">इस फ़ाइल में कनेक्शन की वास्तविक स्वास्थ्य-जाँच अभी लागू नहीं है।</div>';
  }else if(tab==='telegram'){
   root.innerHTML='<h3>✈️ Telegram सेटिंग</h3><p>Bot Token और Chat ID के प्रबंधन के लिए अलग स्थान।</p><label for="tgChatId">Telegram Chat ID</label><input id="tgChatId" placeholder="Chat ID (यदि आवश्यक हो)"><button class="primary full" id="saveTgDraft" type="button">Chat ID इस डिवाइस पर सेव करें</button><p id="tgMsg" class="small-note"></p><div class="notice">सुरक्षा: Bot Token को इस HTML/ब्राउज़र में सेव नहीं करना चाहिए। इसे सुरक्षित सर्वर फ़ंक्शन में रखें। यह टैब अभी सुरक्षित Telegram संदेश भेजने का पूरा कनेक्शन नहीं है।</div>';
   const t=document.getElementById('tgChatId');try{t.value=localStorage.getItem('ssb_tg_chat_id_draft')||''}catch(e){}
   document.getElementById('saveTgDraft').onclick=()=>{try{localStorage.setItem('ssb_tg_chat_id_draft',t.value.trim());document.getElementById('tgMsg').textContent='Chat ID इस डिवाइस पर सेव है; Telegram कनेक्शन अभी सक्रिय नहीं हुआ।'}catch(e){document.getElementById('tgMsg').textContent='सेव नहीं हो पाया।'}};
  }else if(tab==='permissions'){
   root.innerHTML='<h3>🛡️ अधिकार एवं गोपनीयता</h3><ul><li>शिक्षक का निजी डेटा दूसरे शिक्षक को नहीं दिखना चाहिए।</li><li>निजी चैट केवल उसके प्रतिभागियों को पढ़ने की अनुमति हो।</li><li>प्रकाशित सामग्री सभी अधिकृत शिक्षकों को दिखाई जा सकती है।</li><li>सिर्फ UI में बटन छिपाना सुरक्षा नहीं है; Firestore Rules में भी अधिकार लागू हों।</li></ul><div class="notice">ये सुरक्षा आवश्यकताएँ दर्ज की गई हैं; सर्वर Rules का वास्तविक सत्यापन अलग से करना होगा।</div>';
  }else if(tab==='backup'){
   root.innerHTML='<h3>💾 बैकअप / रीस्टोर</h3><p>यह टैब भविष्य में अधिकृत बैकअप और पुनर्स्थापना के लिए है।</p><div class="notice">ऑनलाइन डेटा का सुरक्षित बैकअप और रीस्टोर अभी इस संस्करण में लागू नहीं है। किसी निजी डेटा वाली फ़ाइल को साझा न करें।</div>';
  }else{
   root.innerHTML='<h3>📊 रिपोर्ट</h3><p>शिक्षक उपयोग समय, लॉगिन सत्र और CSV/Excel रिपोर्ट का स्थान।</p><div class="notice">ऑनलाइन उपयोग रिपोर्ट अभी इस संस्करण में लागू नहीं है।</div>';

window.renderTeacherList=()=>{
 const listEl=document.getElementById('teacherList');if(!listEl)return;
 const teachers=window.db.users.filter(x=>x.role!=='admin');
 if(!teachers.length){listEl.innerHTML='<p class="muted">अभी कोई शिक्षक नहीं है।</p>';return}
 listEl.innerHTML=teachers.map(x=>`<div class="item"><b>${window.esc(x.name)}</b> · ${x.role==='subadmin'?'सह-एडमिन':'शिक्षक'}<br>आईडी/मोबाइल: ${window.esc(x.id)}<br>विद्यालय: ${window.esc(x.school||'—')} · प्रखंड: ${window.esc(x.block||'—')}<br>स्थिति: ${x.active===false?'बंद':'सक्रिय'}</div>`).join('');
};
})();

<script type="module">
import {initializeApp, getApps} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getFirestore,doc,setDoc,getDoc,getDocs,collection} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyCBuUpk5KJWZ7ayPWDX124VuHdge1g_m4",
 authDomain:"shikshk-sathi-bihar.firebaseapp.com",
 projectId:"shikshk-sathi-bihar",
 storageBucket:"shikshk-sathi-bihar.firebasestorage.app",
 messagingSenderId:"147684508495",
 appId:"1:147684508495:web:1d3655595a3639f25e7b3a",
 measurementId:"G-4HDFBKVFVE"
};
const app=getApps().some(a=>a.name==='[DEFAULT]')?getApps().find(a=>a.name==='[DEFAULT]'):initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const emailFor=id=>{const v=String(id||'').trim().toLowerCase();return v.includes('@')?v:v+'@shikshaksathi.in'};
const normId=id=>String(id||'').trim().toLowerCase();
const setBusy=(button,busy,label)=>{if(!button)return;button.disabled=busy;if(busy){button.dataset.oldText=button.textContent;button.textContent=label||'कृपया प्रतीक्षा करें...'}else{button.textContent=button.dataset.oldText||label||'सबमिट';delete button.dataset.oldText}};

try{
 const snap=await getDocs(collection(db,'users'));
 window.show(snap.empty?'setup':'login');
}catch(err){
 window.show('login');
 window.msg('loginMsg','डेटाबेस से कनेक्शन नहीं हो पाया। Firebase कॉन्फ़िगरेशन और Firestore Rules जाँचें।');
}

// मुख्य एडमिन बनाएँ
document.getElementById('setupForm')?.addEventListener('submit',async e=>{
 e.preventDefault();
 const btn=e.submitter||e.currentTarget.querySelector('button[type="submit"]');
 const id=normId(document.getElementById('adminId').value);
 const phone=document.getElementById('adminPhone').value.trim();
 const p=document.getElementById('adminPass').value;
 const p2=document.getElementById('adminPass2').value;
 if(p!==p2){window.msg('setupMsg','दोनों पासवर्ड एक जैसे नहीं हैं।');return}
 if(!/^[0-9+()\-\s]{10,15}$/.test(phone)){window.msg('setupMsg','कृपया सही मोबाइल नंबर लिखें।');return}
 setBusy(btn,true,'खाता बनाया जा रहा है...');
 try{
  await createUserWithEmailAndPassword(auth,emailFor(id),p);
  await setDoc(doc(db,'users',id),{id,name:document.getElementById('adminName').value.trim(),phone,role:'admin',active:true,createdAt:new Date().toISOString()});
  window.msg('setupMsg','मुख्य एडमिन खाता बन गया। अब लॉगिन स्क्रीन खुल रही है।');
  setTimeout(()=>window.show('login'),1200);
 }catch(err){window.msg('setupMsg','खाता नहीं बन पाया: '+(err.code||err.message));}
 finally{setBusy(btn,false)}
});

// शिक्षक स्वयं पंजीकरण
document.getElementById('signupForm')?.addEventListener('submit',async e=>{
 e.preventDefault();
 const btn=e.submitter||e.currentTarget.querySelector('button[type="submit"]');
 const phone=document.getElementById('suPhone').value.trim();
 const pass=document.getElementById('suPass').value;
 const pass2=document.getElementById('suPass2').value;
 if(!/^\+?[0-9]{10,13}$/.test(phone)){alert('कृपया 10 से 13 अंकों का सही मोबाइल नंबर लिखें।');return}
 if(pass!==pass2){alert('दोनों पासवर्ड एक जैसे नहीं हैं। कृपया दोबारा जाँचें।');return}
 setBusy(btn,true,'पंजीकरण हो रहा है...');
 try{
  const id=normId(phone);
  await createUserWithEmailAndPassword(auth,emailFor(id),pass);
  await setDoc(doc(db,'users',id),{id,phone,name:document.getElementById('suName').value.trim(),school:document.getElementById('suSchool').value.trim(),district:document.getElementById('suDistrict').value.trim(),block:document.getElementById('suBlock').value.trim(),role:'teacher',active:true,createdAt:new Date().toISOString()});
  document.getElementById('loginId').value=id;
  document.getElementById('signupBox').classList.add('hidden');
  document.getElementById('loginForm').classList.remove('hidden');
  window.msg('loginMsg','ऑनलाइन पंजीकरण सफल! अब अपने मोबाइल नंबर और पासवर्ड से लॉगिन करें।');
 }catch(err){alert('पंजीकरण विफल: '+(err.code||err.message));}
 finally{setBusy(btn,false)}
});

// लॉगिन
document.getElementById('loginForm')?.addEventListener('submit',async e=>{
 e.preventDefault();
 const btn=e.submitter||e.currentTarget.querySelector('button[type="submit"]');
 const id=normId(document.getElementById('loginId').value);
 const pass=document.getElementById('loginPass').value;
 setBusy(btn,true,'लॉगिन हो रहा है...');
 try{
  await signInWithEmailAndPassword(auth,emailFor(id),pass);
  const userSnap=await getDoc(doc(db,'users',id));
  if(!userSnap.exists()){await signOut(auth);window.msg('loginMsg','फायरबेस में यूज़र रिकॉर्ड नहीं मिला।');return}
  const user=userSnap.data();
  if(user.active===false){await signOut(auth);window.msg('loginMsg','यह खाता बंद है। मुख्य एडमिन से संपर्क करें।');return}
  window.current=user;
  document.getElementById('loginMsg').classList.add('hidden');
  window.renderApp();
 }catch(err){window.msg('loginMsg','लॉगिन विफल। यूज़र आईडी, पासवर्ड और इंटरनेट कनेक्शन जाँचें।')}
 finally{setBusy(btn,false)}
});

// एडमिन के लिए यूज़र सूची
window.fetchUsersFromFirebase=async()=>{
 try{
  const snap=await getDocs(collection(db,'users'));
  window.db.users=[];
  snap.forEach(d=>window.db.users.push(d.data()));
  window.renderTeacherList();
 }catch(err){
  const el=document.getElementById('teacherList');
  if(el)el.innerHTML='<p class="muted">सूची लोड नहीं हुई। Firebase Security Rules जाँचें।</p>';
 }
};

// एडमिन द्वारा शिक्षक/सह-एडमिन बनाना। एक ही फॉर्म पर बार-बार listener न लगे।
window.wireAdmin=()=>{
 const form=document.getElementById('teacherForm');
 if(!form||form.dataset.wired==='yes')return;
 form.dataset.wired='yes';
 form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!window.current||window.current.role!=='admin'){
   alert('केवल मुख्य एडमिन नया खाता बना सकता है।');return;
  }
  const btn=document.getElementById('saveUserButton');
  const id=normId(document.getElementById('tId').value);
  const phone=document.getElementById('tId').value.trim();
  const pass=document.getElementById('tPass').value;
  if(!/^\+?[0-9]{10,13}$/.test(phone)){alert('कृपया 10 से 13 अंकों का सही मोबाइल नंबर लिखें।');return}
  if(!pass||pass.length<8){alert('नया खाता बनाने के लिए कम से कम 8 अक्षर का पासवर्ड आवश्यक है।');return}
  setBusy(btn,true,'सेव हो रहा है...');
  try{
   // अलग Firebase Auth ऐप का उपयोग, ताकि मुख्य एडमिन लॉगआउट न हो।
   const secondaryName='SecondaryApp';
   const secondaryApp=getApps().find(a=>a.name===secondaryName)||initializeApp(firebaseConfig,secondaryName);
   const secondaryAuth=getAuth(secondaryApp);
   await createUserWithEmailAndPassword(secondaryAuth,emailFor(id),pass);
   await signOut(secondaryAuth);
   await setDoc(doc(db,'users',id),{id,phone,name:document.getElementById('tName').value.trim(),school:document.getElementById('tSchool').value.trim(),block:document.getElementById('tBlock').value.trim(),district:document.getElementById('tDistrict').value.trim(),role:document.getElementById('tRole').value,active:true,createdAt:new Date().toISOString()});
   alert('खाता फायरबेस में सेव हो गया।');
   form.reset();
   await window.fetchUsersFromFirebase();
  }catch(err){alert('खाता नहीं बन पाया: '+(err.code||err.message));}
  finally{setBusy(btn,false)}
 });
};
</script>
